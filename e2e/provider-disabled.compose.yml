# This UI/auth smoke does not exercise object storage. Keep S3 disabled so it
# does not depend on MinIO's unavailable public images; storage tests live in the backend.
services:
  backend:
    environment:
      AWS_ENABLED: "false"
  frontend:
    environment:
      # Standalone builds require the server-side Docker-network API address.
      INTERNAL_API_URL: ${FRONTEND_DOCKER_API_URL}
